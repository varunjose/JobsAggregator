name: Ingest US jobs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Pull jobs
        env:
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          CORESIGNAL_API_KEY: ${{ secrets.CORESIGNAL_API_KEY }}
          JOBSPIPE_API_KEY: ${{ secrets.JOBSPIPE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m aggregator ingest

      - name: Publish snapshot
        run: |
          mkdir -p data docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/meta.json docs/jobs.json docs/meta.json
          if git diff --staged --quiet; then
            echo "No job snapshot changes"
          else
            git commit -m "data: refresh US jobs snapshot"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    needs: ingest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
