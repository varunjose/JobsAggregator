# These keyless public feeds make a fresh clone useful without any paid data provider.
# Jobicy permits automated polling no more than hourly; this app runs every two hours.
sources:
  - type: jobicy
    enabled: true
    options:
      geo: usa
      industry: engineering
      count: 200

  - type: jobicy
    enabled: true
    options:
      geo: usa
      industry: data-science
      count: 200

  # Remote OK requires attribution and a link back. JobSignal preserves its provider name
  # and canonical URL on every record. Limit the feed to relevant technical job families.
  - type: remoteok
    enabled: true
    options:
      targeted_only: true

  # Direct ATS GET endpoints are also free, but every company has its own board identifier.
  # Copy a block, set the real company/token, and enable it for the companies you follow.
  - type: greenhouse
    enabled: false
    company: Example Company
    token: company-board-token

  - type: lever
    enabled: false
    company: Example Company
    token: company-site-token

  - type: ashby
    enabled: false
    company: Example Company
    board: CompanyBoardName

  - type: smartrecruiters
    enabled: false
    company: Example Company
    token: company-identifier
    fetch_details: true

  # Workday does not expose one anonymous global endpoint. Configure each public tenant/site.
  - type: workday
    enabled: false
    company: Example Company
    host: example.wd1.myworkdayjobs.com
    tenant: example
    site: External_Careers
    fetch_details: true
